name: Refresh public signed update manifest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['refresh_manifest.py']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests cryptography
      - name: Refresh verified manifest asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: python refresh_manifest.py
