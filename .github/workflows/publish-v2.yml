name: Publish verified v2 installer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python assemble_public_release.py
