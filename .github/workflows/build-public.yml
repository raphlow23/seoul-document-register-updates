name: Build public Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-public.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python build dependencies
        run: python -m pip install -r requirements.txt pefile
      - name: Prepare native OCR dependencies
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://micro.mamba.pm/api/micromamba/win-64/latest' -OutFile micromamba.tar.bz2
          tar -xf micromamba.tar.bz2
          & .\Library\bin\micromamba.exe create -y -p "$env:GITHUB_WORKSPACE\build-tools\ocr-env" -c conda-forge --override-channels 'tesseract=5.5.1' 'libarchive=3.8.11=lgpl*'
          if ($LASTEXITCODE -ne 0) { throw 'OCR environment creation failed' }
          python prepare_ocr.py
          if ($LASTEXITCODE -ne 0) { throw 'OCR preparation failed' }
      - name: Build frozen Windows application
        run: python -m PyInstaller --noconfirm --clean SeoulDocumentRegister.spec
      - name: Verify executable and upload draft payloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci_release.py build
