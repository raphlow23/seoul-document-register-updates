name: Publish signed public installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['latest.json']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests cryptography
      - name: Verify signature, assemble installer and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci_release.py finalize
