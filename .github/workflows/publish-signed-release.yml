name: Publish verified signed Windows update
on:
  push:
    branches: [main]
    paths: ['latest.json']
permissions:
  contents: write
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests cryptography
      - name: Verify signed manifest and publish draft payloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RETENTION_DISABLED: '1'
        run: python ci_release.py finalize
